[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback for client-side routing & room code links (?room=...)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and microphone permission policy headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=*, camera=(), geolocation=()"

# Cache static hashed assets for fast load times
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
